frr defaults traditional
hostname loja2
log stdout
ip forwarding
!
interface eth1
 description MPLS - rede dedicada
 ip address 100.64.1.9/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description Internet - VPN e saida local
 ip address 100.64.2.9/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description caixas - 10.20.11.128/26
 ip address 10.20.11.129/26
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.12
!
