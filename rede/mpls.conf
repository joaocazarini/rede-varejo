frr defaults traditional
hostname mpls
log stdout
ip forwarding
!
interface eth1
 description matriz
 ip address 100.64.1.2/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description loja1
 ip address 100.64.1.6/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description loja2
 ip address 100.64.1.10/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description nuvem
 ip address 100.64.1.14/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 100.64.255.1
!
