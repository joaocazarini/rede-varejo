frr defaults traditional
hostname matriz
log stdout
ip forwarding
!
interface eth1
 description MPLS - rede dedicada
 ip address 100.64.1.1/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description Internet - VPN e saida local
 ip address 100.64.2.1/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description servidores (ERP) - 10.20.2.0/25
 ip address 10.20.2.1/25
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
interface eth4
 description usuarios - 10.20.0.0/23
 ip address 10.20.0.1/23
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.1
!
