frr defaults traditional
hostname inet
log stdout
ip forwarding
!
interface eth1
 description matriz
 ip address 100.64.2.2/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth2
 description loja1
 ip address 100.64.2.6/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description loja2
 ip address 100.64.2.10/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth4
 description nuvem
 ip address 100.64.2.14/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth5
 description sites da internet
 ip address 100.64.200.1/24
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 100.64.255.2
!
