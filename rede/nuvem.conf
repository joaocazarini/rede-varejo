frr defaults traditional
hostname nuvem
log stdout
ip forwarding
!
interface eth1
 description MPLS - link dedicado ate a nuvem
 ip address 100.64.1.13/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description Internet - VPN de reserva e saida com NAT
 ip address 100.64.2.13/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description sub-rede privada - 10.20.32.0/24
 ip address 10.20.32.1/24
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.21
!
