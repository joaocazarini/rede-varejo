frr defaults traditional
hostname loja1
log stdout
ip forwarding
!
interface eth1
 description MPLS - rede dedicada
 ip address 100.64.1.5/30
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description Internet - VPN e saida local
 ip address 100.64.2.5/30
 ip ospf area 0
 ip ospf cost 100
 ip ospf network point-to-point
!
interface eth3
 description caixas - 10.20.9.128/26
 ip address 10.20.9.129/26
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
interface eth4
 description convidados - 10.20.8.0/24
 ip address 10.20.8.1/24
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
interface eth5
 description IoT - 10.20.9.192/26
 ip address 10.20.9.193/26
 ip ospf area 0
 ip ospf cost 10
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.11
!
